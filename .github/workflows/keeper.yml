name: corrected Cronpot keeper

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "First run only: initialize an empty journal after checking this keeper account has no pending transaction"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: corrected-cronpot-keeper
  cancel-in-progress: false

jobs:
  keeper:
    if: github.repository == 'willy264/portal_dot' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DATA_DIR: ${{ github.workspace }}/data/corrected-keeper
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP: ${{ inputs.bootstrap || false }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Restore previous keeper journal or fail closed
        id: restore
        run: node scripts/keeper-artifact-state.mjs restore
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - run: pnpm install --frozen-lockfile
      - name: Run keeper once
        timeout-minutes: 4
        env:
          RELAYER_SEED: ${{ secrets.KEEPER_SEED }}
        run: |
          test -n "$RELAYER_SEED" || { echo 'KEEPER_SEED is not configured; no transaction submitted.'; exit 1; }
          node --import tsx scripts/automatic-refund.ts --keeper-only --once --timeout-ms=120000
      - name: Preserve journal even after keeper failure
        if: always() && steps.restore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: corrected-keeper-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/corrected-keeper/corrected-keeper-journal.json
            data/corrected-keeper/automatic-refund-status.json
            data/corrected-keeper/preflight.json
            data/corrected-keeper/workflow-state.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 9
      - name: Summarize finalized jobs and transaction hashes
        if: always() && steps.restore.outputs.ready == 'true'
        run: node scripts/keeper-artifact-state.mjs summary
