name: proof-report
on:
  push:
    branches: [main]
    paths:
      [
        "deployments/**",
        "docs/DECISIONS.md",
        "scripts/report.ts",
        "scripts/report-model.ts",
        "package.json",
        "pnpm-lock.yaml",
        "contracts/**",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - name: Verify contracts for this report revision
        run: |
          mkdir -p reports
          forge test --root contracts --json > reports/foundry.json
      - run: pnpm tsx scripts/report.ts --out site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish permanent proof report
        id: deployment
        uses: actions/deploy-pages@v4
