services:
  web:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      RELAYER_URL: http://relayer:8787
      CHAIN_INDEXER_URL: http://relayer:8787
      EVIDENCE_BACKEND_URL: http://relayer:8787
      EVIDENCE_BACKEND_TOKEN: ${EVIDENCE_BACKEND_TOKEN}
      WSS_URL: wss://test-node-v3.portaldot.dev
      EVM_RPC_URL: https://test-evm-rpc-v3.portaldot.dev
    depends_on: [relayer]
  relayer:
    build: .
    command: ["pnpm", "--filter", "@metermend/cronpot-relayer", "start"]
    restart: unless-stopped
    ports: ["8787:8787"]
    environment:
      RELAYER_SEED: ${RELAYER_SEED}
      MODE: ${MODE:-keeper}
      DB_PATH: /data/cronpot.sqlite
      EVIDENCE_DIR: /data/evidence
      EVIDENCE_BACKEND_TOKEN: ${EVIDENCE_BACKEND_TOKEN}
    volumes: ["relayer-data:/data"]
  bot:
    build: .
    command: ["pnpm", "--filter", "@metermend/debox-bot", "start"]
    restart: unless-stopped
    environment:
      CHAIN_INDEXER_URL: http://relayer:8787
      APP_URL: ${APP_URL:-http://localhost:3000}
      BOT_DB_PATH: /data/debox.sqlite
      DEBOX_API_KEY: ${DEBOX_API_KEY:-}
      DEBOX_GROUP_ID: ${DEBOX_GROUP_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes: ["bot-data:/data"]
    depends_on: [relayer]
volumes:
  relayer-data:
  bot-data:
